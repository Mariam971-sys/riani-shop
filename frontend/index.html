<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Google Search Console -->
    <meta
      name="google-site-verification"
      content="JAXLRnlZJTT3mxKVJ8OQkEgF0VpbfpO8yi-ylqPP_-w"
    />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6235866439848876"
      crossorigin="anonymous"
    ></script>

    <!-- SEO -->
    <title>
      Riani Shop | Fashion for Women, Men, Kids, Shoes & Accessories
    </title>

    <meta
      name="description"
      content="Shop modern fashion for women, men and kids at Riani Shop. Discover clothing, shoes and accessories online."
    />

    <meta
      name="keywords"
      content="Riani Shop, fashion, clothing, shoes, accessories, women fashion, men fashion, kids fashion, online shop"
    />

    <meta name="author" content="Riani Shop" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#111111" />

    <!-- Canonical -->
    <link rel="canonical" href="https://riani-shop.com/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Riani Shop" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://riani-shop.com/" />

    <meta
      property="og:title"
      content="Riani Shop | Fashion for Women, Men, Kids, Shoes & Accessories"
    />

    <meta
      property="og:description"
      content="Shop modern fashion for women, men and kids at Riani Shop. Discover clothing, shoes and accessories online."
    />

    <meta
      property="og:image"
      content="https://riani-shop.com/og-image.jpg"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Riani Shop fashion" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Riani Shop | Fashion for Women, Men, Kids, Shoes & Accessories"
    />

    <meta
      name="twitter:description"
      content="Shop modern fashion for women, men and kids at Riani Shop. Discover clothing, shoes and accessories online."
    />

    <meta
      name="twitter:image"
      content="https://riani-shop.com/og-image.jpg"
    />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Riani Shop",
        "url": "https://riani-shop.com/",
        "logo": "https://riani-shop.com/apple-touch-icon.png",
        "image": "https://riani-shop.com/og-image.jpg",
        "description": "Shop modern fashion for women, men and kids at Riani Shop."
      }
    </script>

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Riani Shop",
        "url": "https://riani-shop.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://riani-shop.com/shop?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
